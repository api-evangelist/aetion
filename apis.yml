aid: aetion
name: Aetion
description: 'Aetion is a healthcare technology company that builds real-world evidence
  (RWE) software for biopharma, medical device manufacturers, payers and regulators.
  Its Aetion Evidence Platform (AEP) turns claims, electronic health record, registry,
  patient-reported and trial data into transparent, reproducible, regulatory-grade
  evidence, delivered as a set of applications: Discover for exploratory analysis,
  Substantiate for study implementation, Activate as a low-code plus hosted-code workbench,
  and Generate for synthetic data. Founded by two Harvard Medical School professors,
  Aetion was acquired by Datavant; the acquisition closed 11 July 2025 and Aetion now
  operates inside Datavant''s Life Sciences business. As of this profile the aetion.com
  domain redirects wholesale to datavant.com and Aetion publishes no standalone developer
  program, public API reference or machine-readable specification.'
